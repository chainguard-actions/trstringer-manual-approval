name: Test issue-body-file-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          approvers: octocat
          secret: fake-secret-token-for-testing
          issue-body-file-path: >-
            ${{ github.workspace }}/actions/hardened/trstringer--manual-approval/v1.11.0/tests/fixtures/issue-body.md
        continue-on-error: true
      - name: Assert action ran with issue-body-file-path input
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with issue-body-file-path input"
