name: Test manual-approval with custom approval and denial words
on:
  workflow_dispatch:
jobs:
  test-custom-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with custom approved and denied words
        id: action
        uses: .
        continue-on-error: true
        with:
          approvers: some-approver,another-approver
          secret: invalid-fake-token-for-custom-words-test
          minimum-approvals: "1"
          issue-title: "Custom Approval Title"
          issue-body: "Please approve or deny this workflow run."
          issue-labels: "approval,workflow"
          additional-approved-words: "yes,go,proceed"
          additional-denied-words: "no,stop,cancel"
          exclude-workflow-initiator-as-approver: "false"
          fail-on-denial: "true"
          polling-interval-seconds: "5"
          close-issue-means-denial: "false"
      - name: Assert action failed due to invalid token
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed at API call stage with custom words configured"
