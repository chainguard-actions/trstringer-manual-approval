name: Test manual-approval with custom approved/denied words
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts custom approved/denied words inputs.
      # The action will fail since no one approves, but we verify it started correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          approvers: nonexistent-approver-xyz-99999
          secret: ${{ secrets.GITHUB_TOKEN }}
          issue-title: "CI Test - Custom Words Test"
          issue-body: "Automated test for custom approval/denial words. Safe to close."
          additional-approved-words: "yes,yep,sure"
          additional-denied-words: "no,nope,reject"
          fail-on-denial: 'true'
          polling-interval-seconds: '10'

      - name: Assert action ran with custom words inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom words (outcome=$OUTCOME)"
