name: Test manual-approval with invalid token
on:
  workflow_dispatch:
jobs:
  test-invalid-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid token and expect failure
        id: action
        uses: .
        continue-on-error: true
        with:
          approvers: some-approver
          secret: invalid-fake-token-that-will-fail-auth
          issue-title: "Test Approval Request"
          issue-body: "This is a test approval request"
          fail-on-denial: "true"
          polling-interval-seconds: "5"
      - name: Assert action failed due to invalid token
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"
