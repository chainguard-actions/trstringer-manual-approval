name: Test manual approval with fail-on-denial disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that fail-on-denial=false and close-issue-means-denial=true
      # inputs are accepted and the action starts correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          approvers: test-approver
          secret: fake-token-for-testing
          issue-title: "Approval Required (no-fail mode)"
          fail-on-denial: "false"
          close-issue-means-denial: "true"
          polling-interval-seconds: "1"

      - name: Assert action ran with fail-on-denial=false inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail due to fake token, not due to bad input parsing.
          # A 'failure' outcome confirms the action started and processed inputs.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with fail-on-denial=false and failed as expected (fake token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
