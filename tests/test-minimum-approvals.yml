name: Test manual-approval with minimum-approvals and exclude-initiator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts minimum-approvals and exclude-workflow-initiator-as-approver inputs.
      # The action will fail since no one approves, but we verify it started correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          approvers: nonexistent-approver-xyz-99999,nonexistent-approver-abc-88888
          secret: ${{ secrets.GITHUB_TOKEN }}
          minimum-approvals: '1'
          issue-title: "CI Test - Minimum Approvals Test"
          issue-body: "Automated test for minimum approvals setting. Safe to close."
          exclude-workflow-initiator-as-approver: 'true'
          fail-on-denial: 'true'
          polling-interval-seconds: '10'

      - name: Assert action ran with minimum-approvals inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with minimum-approvals (outcome=$OUTCOME)"
