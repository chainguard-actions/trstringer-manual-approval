name: Test optional inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with optional inputs and invalid secret (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          approvers: nonexistent-user-xyz-12345
          secret: invalid-fake-token-that-will-fail
          minimum-approvals: "1"
          issue-title: "Custom approval title"
          issue-body: "Please approve this workflow run."
          issue-labels: "approval,workflow"
          additional-approved-words: "lgtm,yes,go ahead"
          additional-denied-words: "nope,reject"
          exclude-workflow-initiator-as-approver: "false"
          fail-on-denial: "true"
          polling-interval-seconds: "5"
          close-issue-means-denial: "false"

      - name: Assert action failed (invalid secret, not a startup/input error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid secret, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (optional inputs were accepted, failure was due to invalid secret)"
