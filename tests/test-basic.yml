name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          approvers: octocat
          secret: fake-secret-token-for-testing
        continue-on-error: true
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action will fail because the token is fake, but it should
          # have accepted the inputs and attempted to run
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with required inputs"
