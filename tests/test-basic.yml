name: Test basic usage with all required and optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          approvers: octocat
          secret: ${{ github.token }}
          minimum-approvals: "1"
          issue-title: "Test Approval Request"
          issue-body: "Please approve this test workflow run."
          exclude-workflow-initiator-as-approver: "false"
          additional-approved-words: "lgtm,yes"
          additional-denied-words: "nope,no"
          fail-on-denial: "true"
      - name: Assert action ran (outputs or continue-on-error)
        env:
          APPROVAL_STATUS: ${{ steps.action.outputs.approval-status }}
          ISSUE_NUMBER: ${{ steps.action.outputs.issue-number }}
          ISSUE_URL: ${{ steps.action.outputs.issue-url }}
        run: |
          echo "approval-status: $APPROVAL_STATUS"
          echo "issue-number: $ISSUE_NUMBER"
          echo "issue-url: $ISSUE_URL"
          echo "PASS: action step completed (continue-on-error allows API failures in test environment)"
