name: Test basic manual approval invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a GitHub token and approvers list.
      # Under act, we cannot complete the full approval flow (it would
      # require a real GitHub API and human interaction), so we verify
      # that the action starts, attempts to contact the API, and fails
      # with an authentication/API error rather than a configuration error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          approvers: test-approver
          secret: fake-token-for-testing
          issue-title: "Test Approval Request"
          issue-body: "This is a test approval request from act."
          polling-interval-seconds: "1"
          fail-on-denial: "true"

      - name: Assert action ran (expected to fail due to fake token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because the fake token cannot authenticate
          # with the GitHub API. A 'failure' outcome means the action ran
          # and attempted to contact the API (not a Docker/config error).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected with fake credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded (may have connected to API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
