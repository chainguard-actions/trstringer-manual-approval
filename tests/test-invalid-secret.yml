name: Test invalid secret causes quick failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid secret (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          approvers: nonexistent-user-xyz-12345
          secret: invalid-fake-token-that-will-fail
          issue-title: "Test approval issue - should fail fast"
          polling-interval-seconds: "5"
          fail-on-denial: "true"

      - name: Assert action failed due to invalid secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid secret, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid secret"
