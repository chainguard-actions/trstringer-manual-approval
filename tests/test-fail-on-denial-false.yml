name: Test fail-on-denial false with custom words
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          approvers: octocat
          secret: ${{ github.token }}
          fail-on-denial: "false"
          additional-approved-words: "lgtm,ship it"
          additional-denied-words: "nope,reject"
          exclude-workflow-initiator-as-approver: "false"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUE_NUMBER: ${{ steps.action.outputs.issue-number }}
          ISSUE_URL: ${{ steps.action.outputs.issue-url }}
          APPROVAL_STATUS: ${{ steps.action.outputs.approval-status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issue-number: $ISSUE_NUMBER"
          echo "issue-url: $ISSUE_URL"
          echo "approval-status: $APPROVAL_STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ISSUE_NUMBER" ] && [ -z "$APPROVAL_STATUS" ]; then
              echo "FAIL: action succeeded but no outputs were set"
              exit 1
            fi
            echo "PASS: action succeeded with outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
