name: Test manual-approval with invalid target repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action should fail quickly when given a non-existent target repository.
      # We use continue-on-error so we can assert on the outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          approvers: nonexistent-user-xyz-12345
          secret: ${{ secrets.GITHUB_TOKEN }}
          issue-title: "Test approval request"
          target-repository-owner: nonexistent-owner-xyz-12345
          target-repository: nonexistent-repo-xyz-12345
          fail-on-denial: 'true'
          polling-interval-seconds: '10'

      - name: Assert action failed due to invalid repository
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid target repository, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid target repository"
