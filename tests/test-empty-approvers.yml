name: Test empty approvers causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with empty approvers (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          approvers: ""
          secret: ${{ github.token }}
          issue-title: "Test approval - empty approvers"
          polling-interval-seconds: "5"

      - name: Assert action failed with empty approvers
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty approvers, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with empty approvers"
