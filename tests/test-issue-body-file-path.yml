name: Test manual approval with issue-body-file-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the issue-body-file-path input is accepted and processed.
      # The fixture file is committed at hardened/tests/fixtures/issue-body.md.
      # Under act, the action will fail due to the fake token (not a config error),
      # confirming that the file path input was parsed and the action started correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          approvers: test-approver
          secret: fake-token-for-testing
          issue-title: "Test Approval (file body)"
          issue-body-file-path: "${{ github.workspace }}/hardened/tests/fixtures/issue-body.md"
          polling-interval-seconds: "1"
          fail-on-denial: "true"

      - name: Assert action ran with issue-body-file-path input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because the fake token cannot authenticate
          # with the GitHub API. A 'failure' outcome means the action ran and
          # processed the issue-body-file-path input (not a Docker/config error).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with issue-body-file-path and failed as expected (fake token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded (may have connected to API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
