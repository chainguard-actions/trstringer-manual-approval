name: Test issue-body-file-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create issue body file
        run: |
          mkdir -p /tmp/approval-test
          echo "This workflow requires manual approval. Please review and approve." > /tmp/approval-test/issue-body.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          approvers: test-approver
          secret: ${{ github.token }}
          issue-title: "Approval required for test workflow"
          issue-body-file-path: /tmp/approval-test/issue-body.md
          fail-on-denial: 'false'
          polling-interval-seconds: '10'

      - name: Assert action ran (issue created or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUE_NUMBER: ${{ steps.action.outputs.issue-number }}
          ISSUE_URL: ${{ steps.action.outputs.issue-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issue-number: $ISSUE_NUMBER"
          echo "issue-url: $ISSUE_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ISSUE_NUMBER" ]; then
              echo "FAIL: action succeeded but issue-number output is empty"
              exit 1
            fi
            echo "PASS: issue created with number $ISSUE_NUMBER"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
