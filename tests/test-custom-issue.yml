name: Test manual approval with custom issue configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts all optional issue-customization inputs
      # and starts up correctly before failing on API authentication.
      - id: action
        uses: .
        continue-on-error: true
        with:
          approvers: alice,bob,charlie
          secret: fake-token-for-testing
          minimum-approvals: "2"
          issue-title: "Custom Approval Title"
          issue-body: "Please review and approve this workflow run."
          issue-labels: "approval,workflow"
          exclude-workflow-initiator-as-approver: "true"
          additional-approved-words: "lgtm,yes,go"
          additional-denied-words: "nope,reject"
          polling-interval-seconds: "1"
          fail-on-denial: "true"

      - name: Assert action ran with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail due to fake token, not due to bad input parsing.
          # A 'failure' outcome confirms the action started and processed inputs.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom inputs and failed as expected (fake token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
