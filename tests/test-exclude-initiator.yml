name: Test exclude workflow initiator as approver
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          approvers: octocat,github-actions
          secret: ${{ github.token }}
          exclude-workflow-initiator-as-approver: 'true'
          minimum-approvals: '1'
          polling-interval-seconds: '5'
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          ISSUE_NUMBER: ${{ steps.action.outputs.issue-number }}
          ISSUE_URL: ${{ steps.action.outputs.issue-url }}
          APPROVAL_STATUS: ${{ steps.action.outputs.approval-status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issue-number: $ISSUE_NUMBER"
          echo "issue-url: $ISSUE_URL"
          echo "approval-status: $APPROVAL_STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ISSUE_NUMBER" ]; then
              echo "FAIL: action succeeded but issue-number output is empty"
              exit 1
            fi
            echo "PASS: got issue-number '$ISSUE_NUMBER'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
